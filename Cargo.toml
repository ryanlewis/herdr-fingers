[package]
name = "herdr-fingers"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "tmux-fingers for Herdr: type a short hint to copy, paste or open anything visible in a pane"
license = "MIT"
repository = "https://github.com/ryanlewis/herdr-fingers"
readme = "README.md"
keywords = ["herdr", "terminal", "tui", "clipboard", "tmux-fingers"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "=0.23.1"
crossterm = "=0.29.0"
ratatui = "=0.30.2"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
shell-words = "=1.1.1"
thiserror = "=2.0.20"
toml = "=1.1.6+spec-1.1.0"
unicode-width = "=0.2.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
