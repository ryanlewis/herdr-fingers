# herdr-fingers configuration.
#
# Lives at $HERDR_PLUGIN_CONFIG_DIR/config.toml; print that directory with
#   herdr plugin config-dir io.rlew.fingers
# Every key is optional. The values below are the defaults.

# Keys hints are built from, best keys first. One of:
#   qwerty, qwerty-homerow, qwerty-left-hand, qwerty-right-hand,
#   azerty, azerty-homerow, azerty-left-hand, azerty-right-hand,
#   qwertz, qwertz-homerow, qwertz-left-hand, qwertz-right-hand,
#   dvorak, dvorak-homerow, dvorak-left-hand, dvorak-right-hand,
#   colemak, colemak-homerow, colemak-left-hand, colemak-right-hand
keyboard_layout = "qwerty"

# Or spell the keys out yourself (overrides keyboard_layout): lowercase
# letters and digits. c, i, m, n and q are reserved for the overlay's own
# controls and silently skipped.
# alphabet = "asdfghjkl"

# Where the hint sits over its match: "left" or "right".
hint_position = "left"

# What happens to the picked text, per key held while typing the hint.
#   ":open:"  open it: web links in the browser, folders with the system
#             opener, files (scripts too) in `editor`, Git SHAs on GitHub,
#             and a pattern's `open_url`; app bundles and installers are only
#             shown in their folder
#   ":copy:"  copy it (see `clipboard` below)
#   ":paste:" type it into the pane the hints came from
#   ""        nothing
# Anything else is a command line, run with the text on its stdin and
# MODIFIER / HINT in its environment, from the pane's working directory.
main_action = ":open:"
ctrl_action = ":copy:"
shift_action = ":paste:"
alt_action = ""

# The editor ":open:" runs on files, in a new pane beside the one the hints
# came from. {path} is replaced by the file and {line} by the line number;
# a word holding {line} is left out when there is none. Without placeholders
# the editor gets `+{line} {path}`. Defaults to $VISUAL, then $EDITOR; with
# neither, files are shown in their folder instead.
# editor = "nvim +{line} {path}"
# Where the editor pane opens: "right" or "down".
editor_split = "right"

# Where ":open:" looks for a relative path it cannot find near the pane (its
# directory, that directory's Git root, folders named on the screen). The
# path opens only when exactly one of these folders has it. Each entry starts
# with / or ~/; a final * stands for every folder directly inside.
search_roots = ["~/dev/*"]

# Built-in patterns to look for; omit to enable them all. Known names:
#   ip, uuid, sha, digit, url, path, hex, kubernetes, kubernetes-pod,
#   git-status, git-status-branch, diff
# enabled_builtin_patterns = ["url", "path", "sha"]

# Your own patterns, in Rust regex syntax. A group named `match` narrows the
# copied text to that group. When a custom pattern and a built-in start at
# the same column, the custom one wins.
# [[patterns]]
# name = "ticket"
# regex = "PROJ-[0-9]+"
#
# A pattern may say where ":open:" sends its matches: {} in `open_url` is
# replaced by the match (the `match` group when there is one), URL-encoded.
# Open ticket keys such as RET-1234 in your tracker.
# [[patterns]]
# name = "jira"
# regex = "\\b(?P<match>[A-Z][A-Z0-9]+-[0-9]+)\\b"
# open_url = "https://example.atlassian.net/browse/{}"

# How ":copy:" reaches the clipboard.
#   "osc52"  through Herdr to the terminal you are looking at (works over SSH)
#   "system" a local command: pbcopy, wl-copy, xclip or xsel, whichever exists
#   "both"   the two above
clipboard = "osc52"
# Force a specific command for "system"/"both" instead of auto-detecting one.
# clipboard_command = ["pbcopy"]

# Show a Herdr toast with the copied text. Herdr itself must have toasts on
# ([ui.toast] delivery = "herdr" in ~/.config/herdr/config.toml).
show_copied_notification = false

# Put the picked text in the log. Off: the log holds only the action and the length.
log_picked_text = false

# List what each key does in the overlay's status line.
show_legend = true

# Joins the texts picked in multi-select mode (Tab).
multi_separator = " "

# Colors: names (black, red, green, yellow, blue, magenta, cyan, white, gray,
# light-red … bright-white), palette indexes (0-255) or "#RRGGBB".
# Attributes: bold, dim, italic, underline, reverse, strikethrough.
[style]
hint = { fg = "black", bg = "yellow", bold = true }
highlight = { fg = "yellow" }
selected_hint = { fg = "black", bg = "light-blue", bold = true }
selected_highlight = { fg = "light-blue" }
# Restyle everything that is not a match, for instance dim it:
# backdrop = { dim = true }
